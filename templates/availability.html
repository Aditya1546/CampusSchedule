<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Availability - CampusSchedule</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <div class="container">
            <div>
                <div class="logo">CampusSchedule</div>
                <div class="subtitle">
                    Timetable & Room Management
                </div>
            </div>

            <nav>
                <a href="/">Schedule</a>
                <a href="/availability">Room Availability</a>
            </nav>
        </div>
    </header>


    <main>
        <div class="container">

            <div class="card">
                <h1>Check Room Availability</h1>
                <p>
                    Check whether a classroom is available for a specific
                    day and time.
                </p>
            </div>


            <div class="card">
                <h2>Availability Checker</h2>

                <form method="POST" action="/availability">

                    <label for="room">Room</label>
                    <input
                        type="text"
                        id="room"
                        name="room"
                        placeholder="e.g. A101"
                        required
                    >

                    <label for="day">Day</label>
                    <select id="day" name="day" required>
                        <option value="">Select day</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                    </select>

                    <label for="start">Start Time</label>
                    <input
                        type="time"
                        id="start"
                        name="start"
                        required
                    >

                    <label for="end">End Time</label>
                    <input
                        type="time"
                        id="end"
                        name="end"
                        required
                    >

                    <button type="submit">Check Availability</button>

                </form>
            </div>


            {% if result %}
            <div class="card">
                <h2>Result</h2>
                <p>{{ result }}</p>
            </div>
            {% endif %}


        </div>
    </main>


    <footer>
        CampusSchedule · Timetable Clash Checker & Room Availability
    </footer>

</body>
</html>
