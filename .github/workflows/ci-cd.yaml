name: CI/CD

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lint
        run: flake8 --max-line-length=120 --exclude=venv .

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t campusschedule .

      - name: Start Docker container
        run: docker run -d --rm --name campusschedule-ci -p 5000:5000 campusschedule

      - name: Smoke test health endpoint
        run: |
          sleep 5
          curl -f http://localhost:5000/health

      - name: Stop Docker container
        if: always()
        run: docker stop campusschedule-ci

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"